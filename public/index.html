
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DVOPS - Resource Management Web App</title>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">

    <script src="js/view-resources.js"></script>
</head>

<body onload="viewResources()">
    <div class="container mt-5">

        <div class="row justify-content-center mb-4">
            <img src="images/logo.png" alt="Resource Management Logo">
        </div>

        <div class="row">
            <div class="col-md-12">
                <table class="table table-striped table-striped-custom">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Location</th>
                            <th>Description</th>
                            <th>Owner</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="tableContent">
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</body>
</html>
